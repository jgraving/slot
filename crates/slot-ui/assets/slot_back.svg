<svg xmlns="http://www.w3.org/2000/svg" width="720" height="72" viewBox="0 0 720 72">
<defs>
<clipPath id="ribPaint"><rect x="230" y="-5" width="260" height="30"/></clipPath>
<linearGradient id="paint" x2="0" y2="1"><stop stop-color="#b50000"/><stop offset="1" stop-color="#ae0000"/></linearGradient>
<linearGradient id="metal" x2=".8" y2="1"><stop stop-color="#c8ccca"/><stop offset=".4" stop-color="#a7aeac"/><stop offset="1" stop-color="#707976"/></linearGradient>
<linearGradient id="throat" gradientUnits="userSpaceOnUse" x1="0" y1="25" x2="0" y2="44"><stop stop-color="#292e31"/><stop offset=".08" stop-color="#858d91"/><stop offset=".24" stop-color="#aeb5b8"/><stop offset=".65" stop-color="#a2aaae"/><stop offset=".88" stop-color="#b5bdc0"/><stop offset="1" stop-color="#909a9f"/></linearGradient>

<!-- One continuous shoulder field in both layers. It fades to the deck in
     both axes, and is clipped to the actual material boundary, never the liner. -->
<!-- Rolled perimeter lighting is directional, not a spherical highlight. -->
<linearGradient id="shoulderRound" gradientUnits="userSpaceOnUse" x1="122" y1="0" x2="166" y2="0">
 <stop stop-color="#8b0000"/><stop offset=".18" stop-color="#a50000"/>
 <stop offset=".55" stop-color="#bb0000"/><stop offset="1" stop-color="#b50000"/>
</linearGradient>
<linearGradient id="innerRoll" gradientUnits="userSpaceOnUse" x1="184" y1="0" x2="222" y2="0">
 <stop stop-color="#b50000"/><stop offset=".2" stop-color="#c60000"/>
 <stop offset=".5" stop-color="#a20000"/><stop offset=".78" stop-color="#690000"/><stop offset="1" stop-color="#4b0000"/>
</linearGradient>
<linearGradient id="shoulderFade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="68"><stop offset=".28" stop-color="white"/><stop offset=".72" stop-color="#606060"/><stop offset="1" stop-color="black"/></linearGradient>
<mask id="shoulderBlend"><rect x="120" y="0" width="480" height="72" fill="url(#shoulderFade)"/></mask>
<linearGradient id="shoulderJoin" gradientUnits="userSpaceOnUse" x1="160" y1="0" x2="222" y2="0"><stop stop-color="white"/><stop offset=".3" stop-color="#e0e0e0"/><stop offset=".65" stop-color="#707070"/><stop offset="1" stop-color="black"/></linearGradient>
<mask id="shoulderSideBlend"><rect x="120" y="0" width="102" height="72" fill="url(#shoulderJoin)"/><rect x="120" y="0" width="102" height="72" fill="url(#shoulderJoin)" transform="translate(720 0) scale(-1 1)"/></mask>
<clipPath id="plasticSurface"><path clip-rule="evenodd" d="M122 72V36Q122 1 158 1H562Q598 1 598 36V72Z M206 31.25H514V72H206Z"/></clipPath>
</defs>
<!-- Rear deck and inset throat. Detail proportions measured from the supplied SP close-up. -->
<!-- Rounded SP body: open-ended at the screen bottom, not an infinite deck. -->
<path d="M122 72V36Q122 1 158 1H562Q598 1 598 36V72Z" fill="url(#paint)"/>
<path d="M123 72V36Q123 2 158 2H562Q597 2 597 36V72" fill="none" stroke="#d00000" stroke-width="1.2"/>
<g transform="translate(-76.5354330709 5) scale(1.2125984252 1.05)">
<path d="M233 25H487V58H233Z" fill="url(#throat)"/>
<path d="M233 25H487" stroke="#343b3e" stroke-width=".6"/>
<!-- Set-back metal liner: rear edge and faint vertical tooling, behind the cart. -->
<path d="M238 25H482" stroke="#3b4145" stroke-width=".9"/>
<path d="M240 26H480" stroke="#c1c7c9" stroke-width=".5" opacity=".45"/>
<path d="M252 28v12m9 -12v12m14 -12v12m10 -12v12m14 -12v12m9 -12v12m15 -12v12m8 -12v12m13 -12v12m11 -12v12m12 -12v12m10 -12v12m14 -12v12m10 -12v12m13 -12v12m9 -12v12m14 -12v12m9 -12v12m12 -12v12m9 -12v12" stroke="#6f787e" stroke-width=".3" opacity=".14"/>
<path d="M257 28v9m31 -9v12m17 -11v8m32 -9v13m28 -12v10m31 -11v12m23 -12v8m29 -8v11" stroke="#edf0f0" stroke-width=".25" opacity=".16"/>
<!-- Wide inverted-U molded ribs: open at the bottom, painted interior, rolled edges. -->
<g fill="none" stroke-linejoin="round" clip-path="url(#ribPaint)">
 <path d="M279 25V7a5 5 0 0 1 10 0v18M431 25V7a5 5 0 0 1 10 0v18" stroke="#860000" stroke-width="1.4"/>
 <path d="M280.2 25V7.2a3.8 3.8 0 0 1 7.6 0V25M432.2 25V7.2a3.8 3.8 0 0 1 7.6 0V25" stroke="#c20000" stroke-width=".7"/>
</g>
<!-- Fastener uses one scale on both axes, independent of the wider aperture. -->
<g transform="translate(360 10.5952380952) scale(1.0583333333 1.2222222222) translate(-360 -14)">
<!-- Recessed screw seat, beveled metal head, and a cut Y/tri-point driver pocket. -->
<circle cx="360" cy="14" r="9.1" fill="#780000"/>
<path d="M351 14a9 9 0 0 0 18 0" fill="none" stroke="#c40000" stroke-width=".7"/>
<circle cx="360" cy="14" r="7.4" fill="#3d4342"/>
<circle cx="360" cy="14" r="6.9" fill="url(#metal)"/>
<!-- Three equal arms meet exactly at the shared screw/head center. -->
<path d="M360 14h4.4M360 14l-2.2 -3.810512M360 14l-2.2 3.810512" fill="none" stroke="#d4d8d4" stroke-width="2.7" transform="translate(.18 .30)"/>
<path d="M360 14h4.4M360 14l-2.2 -3.810512M360 14l-2.2 3.810512" fill="none" stroke="#414d47" stroke-width="2.05"/>
<path d="M360 14h4.4M360 14l-2.2 -3.810512M360 14l-2.2 3.810512" fill="none" stroke="#29362f" stroke-width=".45"/>
</g>
<!-- Sparse shallow hairlines, not a repeating scratched overlay. -->
<g fill="none" stroke-width=".3" opacity=".55">
<path d="m303 3 .2 8m23 -7 -.1 6m65 -5 .3 9m16 -10 -.1 7m49 -6 .2 7" stroke="#ca0000"/>
<path d="m303.5 3 .2 8m23 -7 -.1 6m65 -5 .3 9m16 -10 -.1 7m49 -6 .2 7" stroke="#930000"/>
</g>
<!-- The world-space rolled shoulders below also form the inner end returns. -->
</g>
<g clip-path="url(#plasticSurface)"><g mask="url(#shoulderSideBlend)"><g mask="url(#shoulderBlend)">
<rect x="120" y="0" width="102" height="72" fill="url(#shoulderRound)"/>
<rect x="120" y="0" width="102" height="72" fill="url(#shoulderRound)" transform="translate(720 0) scale(-1 1)"/>
</g></g></g>
<!-- Deep, directional inner slopes fall from the case shoulders to the
     mouth. They belong behind the cartridge grip, not on the flat front deck. -->
<g clip-path="url(#plasticSurface)">
<path d="M187 1C206 1 218 15 218 24C218 28 225 31.25 232 31.25H220.57C211 28.1 206 26 206 20C206 9 199 1 187 1Z" fill="url(#innerRoll)"/>
<path d="M187 1C206 1 218 15 218 24C218 28 225 31.25 232 31.25H220.57C211 28.1 206 26 206 20C206 9 199 1 187 1Z" fill="url(#innerRoll)" transform="translate(720 0) scale(-1 1)"/>
</g>
</svg>
