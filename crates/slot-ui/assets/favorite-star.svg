<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <path id="star" d="M64 9 Q65 9 66 12 L79 43 L113 46 Q116 46 113 49 L87 71 L95 105 Q96 109 92 107 L64 89 L35 107 Q32 109 33 105 L41 71 L15 49 Q12 46 16 46 L49 43 L62 12 Q63 9 64 9Z"/>
    <!-- Broad, low-contrast reflections give satin metal rather than gloss. -->
    <linearGradient id="gold" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#d7bf83"/>
      <stop offset=".28" stop-color="#c3a15a"/>
      <stop offset=".52" stop-color="#aa8747"/>
      <stop offset=".77" stop-color="#c9ad6d"/>
      <stop offset="1" stop-color="#b19050"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2=".6" y2="1">
      <stop stop-color="#deca96"/><stop offset=".5" stop-color="#b69a60"/>
      <stop offset="1" stop-color="#8d703a"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4efdf"/><stop offset="1" stop-color="#ded5c2"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feGaussianBlur stdDeviation="1.3"/></filter>
    <clipPath id="clip"><use href="#star"/></clipPath>
    <filter id="grain"><feTurbulence baseFrequency=".7 .35" numOctaves="2" seed="17" type="fractalNoise"/><feColorMatrix type="saturate" values="0"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in2="SourceGraphic" mode="soft-light"/></filter>
  </defs>
  <use href="#star" fill="#291702" stroke="#291702" stroke-width="10" stroke-linejoin="round" opacity=".32" transform="translate(0 2)" filter="url(#shadow)"/>
  <!-- A warm paper backing reads as a real die-cut sticker. The fine dark
       cut edge separates it from pale labels; the paper rim lifts it off dark ones. -->
  <use href="#star" fill="url(#paper)" stroke="#65543b" stroke-width="10" stroke-linejoin="round"/>
  <use href="#star" fill="url(#paper)" stroke="url(#paper)" stroke-width="8" stroke-linejoin="round"/>
  <use href="#star" fill="url(#gold)" stroke="#94763d" stroke-width="1.3" stroke-linejoin="round"/>
  <g clip-path="url(#clip)">
    <use href="#star" fill="url(#gold)" filter="url(#grain)" opacity=".22"/>
    <!-- Subtle brushing over a fully opaque metal base. -->
    <path d="M21 52L92 82M28 55L99 85M36 33L88 55M49 85L87 97" fill="none" stroke="#e1cc96" stroke-opacity=".16" stroke-width=".45"/>
    <path d="M47 68L63 63L81 72M57 30L65 53M69 82L80 91" fill="none" stroke="#876b36" stroke-opacity=".10" stroke-width=".5"/>
  </g>
  <use href="#star" fill="none" stroke="url(#rim)" stroke-width="1.15" stroke-linejoin="round"/>
  <path d="M63 13L50 44L18 48M44 71L36 103" fill="none" stroke="#ddc78e" stroke-width=".8" stroke-linecap="round" opacity=".35"/>
</svg>
