<svg xmlns="http://www.w3.org/2000/svg" width="720" height="72" viewBox="0 0 720 72">
<defs>
 <linearGradient id="paint" x2="0" y2="1"><stop stop-color="#b50000"/><stop offset="1" stop-color="#ae0000"/></linearGradient>
 <linearGradient id="bevel" x2="0" y2="1"><stop stop-color="#860000"/><stop offset=".5" stop-color="#ca0000"/><stop offset="1" stop-color="#ce0000"/></linearGradient>



<!-- One continuous shoulder field in both layers. It fades to the deck in
     both axes, and is clipped to the actual material boundary, never the liner. -->
<radialGradient id="shoulderRound" gradientUnits="userSpaceOnUse" cx="151" cy="12" r="75">
 <stop stop-color="#c80000"/><stop offset=".32" stop-color="#c10000"/>
 <stop offset=".64" stop-color="#ad0000"/><stop offset="1" stop-color="#890000"/>
</radialGradient>
<linearGradient id="shoulderFade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="68"><stop offset=".28" stop-color="white"/><stop offset=".72" stop-color="#606060"/><stop offset="1" stop-color="black"/></linearGradient>
<mask id="shoulderBlend"><rect x="120" y="0" width="480" height="72" fill="url(#shoulderFade)"/></mask>
<linearGradient id="shoulderJoin" gradientUnits="userSpaceOnUse" x1="160" y1="0" x2="222" y2="0"><stop stop-color="white"/><stop offset=".3" stop-color="#e0e0e0"/><stop offset=".65" stop-color="#707070"/><stop offset="1" stop-color="black"/></linearGradient>
<mask id="shoulderSideBlend"><rect x="120" y="0" width="102" height="72" fill="url(#shoulderJoin)"/><rect x="120" y="0" width="102" height="72" fill="url(#shoulderJoin)" transform="translate(720 0) scale(-1 1)"/></mask>
<clipPath id="plasticSurface"><path d="M122 72V36Q122 1 158 1H187C199 1 206 9 206 20C206 26 211 28.1 220.57 28.1C253.31 28.1 279.98 47 323.63 47H396.37C440.02 47 466.69 28.1 499.43 28.1C509 28.1 514 26 514 20C514 9 521 1 533 1H562Q598 1 598 36V72Z" fill="url(#paint)"/></clipPath>
</defs>
<!-- Rounded outer shoulders rise above the straight mouth plane. -->
<path d="M122 72V36Q122 1 158 1H187C199 1 206 9 206 20C206 26 211 28.1 220.57 28.1C253.31 28.1 279.98 47 323.63 47H396.37C440.02 47 466.69 28.1 499.43 28.1C509 28.1 514 26 514 20C514 9 521 1 533 1H562Q598 1 598 36V72Z" fill="url(#paint)"/>


<g clip-path="url(#plasticSurface)"><g transform="translate(-76.5354330709 5) scale(1.2125984252 1.05)">
<!-- Flat lower shell. Only the narrow inner cut edge is beveled; no cast shadow. -->
<path d="M233 22H245C272 22 294 40 330 40H390C426 40 448 22 475 22H487V25H475C448 25 426 43 390 43H330C294 43 272 25 245 25H233Z" fill="url(#bevel)"/>
<path d="M233 22H245C272 22 294 40 330 40H390C426 40 448 22 475 22H487" fill="none" stroke="#6c0000" stroke-width=".7"/>
<path d="M233 25H245C272 25 294 43 330 43H390C426 43 448 25 475 25H487" fill="none" stroke="#c40000" stroke-width=".75"/>
<g fill="none" stroke-width=".3" opacity=".55">
 <path d="m277 32 7 2m28 8 8 1m23 1.4h7m51 -.7 8 -1m26 -9 7 -3" stroke="#ce0000"/>
 <path d="m286 38 7 1.6m34 7 9 .2m72 -2 7 -1.1" stroke="#8e0000"/>
</g>

</g></g>
<g clip-path="url(#plasticSurface)"><g mask="url(#shoulderSideBlend)"><g mask="url(#shoulderBlend)">
<rect x="120" y="0" width="102" height="72" fill="url(#shoulderRound)"/>
<rect x="120" y="0" width="102" height="72" fill="url(#shoulderRound)" transform="translate(720 0) scale(-1 1)"/>
</g></g></g>
<!-- Coaxial recessed seats: a shallow lower wall puts the head slightly
     behind the opening, with every head and driver sharing the same axis. -->
<defs>
 <linearGradient id="wellWall" x2="0" y2="1"><stop stop-color="#20262a"/><stop offset="1" stop-color="#596168"/></linearGradient>
 <linearGradient id="screw" x2=".45" y2="1"><stop stop-color="#b4bbbe"/><stop offset=".45" stop-color="#929ca1"/><stop offset="1" stop-color="#727e84"/></linearGradient>
 <g id="cornerScrew">
  <circle r="13.8" fill="#840000"/>
  <path d="M-13.3 0a13.3 13.3 0 0 0 26.6 0" fill="none" stroke="#cc0000" stroke-width=".8"/>
  <circle r="11.6" fill="url(#wellWall)"/>
  <ellipse cy="1" rx="10.4" ry="10" fill="#242b30"/>
  <g transform="translate(0 1)">
   <circle r="6.8" fill="#4b555c"/>
   <circle r="6.2" fill="url(#screw)"/>
   <path d="M-3.6 0H3.6M0-3.6V3.6" fill="none" stroke="#c2c9cc" stroke-width="1.85" transform="translate(.15 .25)"/>
   <path d="M-3.6 0H3.6M0-3.6V3.6" fill="none" stroke="#354047" stroke-width="1.45"/>
  </g>
 </g>
</defs>
<use href="#cornerScrew" x="158" y="40"/>
<use href="#cornerScrew" x="562" y="40"/>
</svg>
