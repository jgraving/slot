<svg xmlns="http://www.w3.org/2000/svg" width="720" height="58" viewBox="0 0 720 58">
<defs>
 <!-- Red is the shared paint-relief marker; the live shell palette supplies color. -->
 <linearGradient id="paint" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="58">
  <stop stop-color="#8f0000"/><stop offset=".12" stop-color="#bd0000"/>
  <stop offset=".35" stop-color="#b50000"/><stop offset="1" stop-color="#ae0000"/>
 </linearGradient>
 <!-- Original paths approximate the compact molded SP lettering, not a UI font.
      The triangle points toward the connector; EXT.1 stays centered below it. -->
 <g id="mark" fill="none" stroke-width="1.6" stroke-linejoin="round">
  <path d="M360 7L354.2 16.6H365.8Z"/>
  <g transform="translate(332.36 29) skewX(-7)">
   <path d="M10 0H0V14H10M0 6.8H8.2"/>
   <path d="M14 0L24 14M24 0L14 14"/>
   <path d="M28 0H40M34 0V14"/>
   <path d="M50 3L54 0V14M50.5 14H57"/>
   <path d="M44.5 12.7h1.6v1.3h-1.6Z" fill="currentColor" stroke-width=".5"/>
  </g>
 </g>
</defs>
<!-- The opaque strip remains the original connector occlusion plane. -->
<rect width="720" height="58" fill="url(#paint)"/>
<use href="#mark" color="#600000" stroke="#600000" transform="translate(.65 .8)"/>
<use href="#mark" color="#df0000" stroke="#df0000" transform="translate(-.4 -.5)"/>
<use href="#mark" color="#ab0000" stroke="#ab0000"/>
</svg>
