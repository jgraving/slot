name: Device checks
on:
  push:
    branches: [bluetooth-audio, night-display, favorites-recents]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96'
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p slot --no-default-features --features device -- -D warnings
      - run: cargo test -p slot --no-default-features --features device --lib --test bluetooth --test quick_menu --test audio --test collections --test cart_faces --test app --test boot --test single
      - run: cargo test -p slot-power
      - run: cargo test -p slot-gfx --no-default-features --features device --test grade
      - run: cargo test -p slot-ui
      - run: python3 card/test-bluetooth.py
