name: Device checks
on:
  push:
    branches: [bluetooth-audio, night-display, favorites-recents, grab-and-go, tactile-sounds]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: device-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96'
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p slot --no-default-features --features device -- -D warnings
      - run: cargo test -p slot --no-default-features --features device --lib --test bluetooth --test quick_menu --test audio --test collections --test cart_faces --test app --test boot --test single --test comfort --test headphones --test volume --test sfx --test tactile --test sleep --test power
      - run: cargo test -p slot-power
      - run: cargo test -p slot-gfx --no-default-features --features device --test grade
      - run: cargo test -p slot-ui
      - run: python3 card/test-bluetooth.py

  device-package:
    name: RG SP test package
    timeout-minutes: 15
    if: github.event_name == 'pull_request' && (github.head_ref == 'favorites-y-star' || github.head_ref == 'start-closes-options' || github.head_ref == 'faithful-sp-power-switch')
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Build the handheld frontend
        run: cargo build --locked --profile device --target-dir target-device -p slot --no-default-features --features device
      - name: Package the System update
        run: |
          set -eu
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip file
          file target-device/device/slot | grep -q aarch64
          mkdir -p update/System
          cp -a card/System/. update/System/
          cp target-device/device/slot update/System/slot
          chmod 755 update/System/slot
          cp LICENSE update/LICENSE
          git rev-parse HEAD > update/BUILD-COMMIT.txt
          printf '%s\n' 'Power off and back up your current System/slot.' 'Merge the contents of System into the existing System folder on SD2.' 'Replace matching files only; retain mgba_libretro.so, gpsp_libretro.so and other installed files.' 'Games, labels, settings and saves do not need changing.' > update/INSTALL.txt
          printf 'Corresponding source: https://github.com/jgraving/slot/archive/%s.tar.gz\n' "$(git rev-parse HEAD)" > update/SOURCE.txt
          cd update
          sha256sum System/slot > SHA256SUMS
          zip -qry ../slot-sp-power-switch-System.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: slot-sp-power-switch-System
          path: slot-sp-power-switch-System.zip
          if-no-files-found: error
